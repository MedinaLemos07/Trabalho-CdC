<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recycle Agents</title>
  <link rel="stylesheet" href="CSS/style.css" />
  <style>
    .splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* Orbs decorativos */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(0, 255, 106, 0.06);
      top: -100px; right: -100px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: rgba(0, 196, 79, 0.05);
      bottom: -80px; left: -80px;
    }

    /* Logo animada */
    .splash-logo {
      font-size: 5rem;
      margin-bottom: 16px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(0,255,106,0.6));
      position: relative;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    /* Título */
    .splash-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900;
      color: var(--green-neon);
      text-shadow: 0 0 30px rgba(0,255,106,0.5);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .splash-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    /* Botões */
    .splash-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 300px;
      position: relative;
      z-index: 1;
    }

    /* Stats decorativos */
    .splash-stats {
      display: flex;
      gap: 32px;
      margin-top: 60px;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--green-neon);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-divider {
      width: 1px;
      background: var(--green-border);
      align-self: stretch;
    }

    /* Animações de entrada */
    .splash-logo     { animation: float 4s ease-in-out infinite, fadeIn 0.6s ease both; }
    .splash-title    { animation: fadeIn 0.6s 0.15s ease both; }
    .splash-subtitle { animation: fadeIn 0.6s 0.25s ease both; }
    .splash-actions  { animation: fadeIn 0.6s 0.4s ease both; }
    .splash-stats    { animation: fadeIn 0.6s 0.55s ease both; }

    /* Versão */
    .version-tag {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="splash">
    <div class="splash-logo">♻️</div>
    <h1 class="splash-title">RECYCLE<br>AGENTS</h1>
    <p class="splash-subtitle">Recicle. Evolua. Lidere.</p>

    <div class="splash-actions">
      <a href="login.html" class="btn btn-primary btn-full">
        Entrar
      </a>
      <a href="cadastro.html" class="btn btn-outline btn-full">
        Criar Conta
      </a>
    </div>

    <div class="splash-stats">
      <div class="stat-item">
        <div class="stat-value">🌍</div>
        <div class="stat-label">Sustentável</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value">⚡</div>
        <div class="stat-label">Gamificado</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value">🏆</div>
        <div class="stat-label">Ranking</div>
      </div>
    </div>
  </main>

  <span class="version-tag">v1.0.0</span>
</body>
</html>
