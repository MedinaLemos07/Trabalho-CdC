<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg" />
  <link rel="shortcut icon" href="../img/logo.svg" />
  <title>Cadastro — Recycle Agents</title>
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/login.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">
          <i data-lucide="recycle"></i>
        </span>
        <h1>RECYCLE AGENTS</h1>
        <p>Crie sua conta e comece a reciclar</p>
      </div>

      <!-- Card do formulário -->
      <div class="auth-card" id="authCard">
        <h2>Criar conta</h2>

        <!-- Alerta -->
        <div class="alert" id="alertMsg"></div>

        <div class="input-group">
          <label for="nome">Nome de agente</label>
          <input
            type="text"
            id="nome"
            placeholder="Como quer ser chamado?"
            autocomplete="name"
          />
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="input-with-icon">
            <input
              type="password"
              id="senha"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
            />
            <button class="toggle-password" id="toggleSenha" type="button" aria-label="Mostrar senha">
              <i data-lucide="eye" style="width:16px;height:16px"></i>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <div class="input-with-icon">
            <input
              type="password"
              id="confirmarSenha"
              placeholder="Repita a senha"
              autocomplete="new-password"
            />
            <button class="toggle-password" id="toggleConfirmar" type="button" aria-label="Mostrar senha de confirmação">
              <i data-lucide="eye" style="width:16px;height:16px"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-full mt-2" id="btnCadastro">
          <span class="btn-text">Criar conta</span>
          <span class="loader"></span>
        </button>

        <div class="auth-footer mt-2">
          Já tem conta?
          <a href="login.html">Fazer login</a>
        </div>
      </div>

      <!-- Card de verificação de email -->
      <div class="verify-card" id="verifyCard">
        <div class="verify-icon">
          <i data-lucide="mail" style="width:48px;height:48px;color:var(--green-neon)"></i>
        </div>
        <h3 class="verify-title">Verifique seu e-mail!</h3>
        <p class="verify-msg">
          Enviamos um link de confirmação para<br>
          <strong id="verifyEmail"></strong>
        </p>
        <div class="verify-tip">
          <i data-lucide="triangle-alert" style="width:16px;height:16px;flex-shrink:0;margin-top:2px"></i>
          <p>Não encontrou? Verifique sua caixa de <strong>spam</strong> ou <strong>lixo eletrônico</strong>!</p>
        </div>
        <a href="login.html" class="btn btn-primary btn-full mt-2">
          Ir para o Login
        </a>
      </div>

    </div>
  </div>

  <script type="module" src="JS/auth.js"></script>
  <script>lucide.createIcons();</script>

</body>
</html>
